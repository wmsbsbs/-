      width: 100%;
      height: 100%;
      background: radial-gradient(circle at center, rgba(208, 188, 255, 0.15) 0%, transparent 70%);
      z-index: -1;
      opacity: 0;
      transition: opacity 0.3s ease;

    .nav-card:hover::before {
      opacity: 1;
    }

      display: none !important;
    }

      width: 72px;
      height: 72px;
      border-radius: 50%;
      object-fit: contain;
      margin: 0 auto 16px;
      border: 2px solid var(--md-sys-color-primary);
      padding: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.3s ease;
      text-align: center;
      line-height: 1;
      background-color: var(--md-sys-color-surface);
    }
    
    /* 确保emoji不会超出容器 */
    .nav-avatar:has(.emoji-avatar) {
      font-size: 40px;
    }
    
    /* 图片头像样式 */
    .nav-avatar img {
      width: 90%;
      height: 90%;
      object-fit: contain;
      border-radius: 50%;
    }

    .nav-card:hover .nav-avatar {
      border-color: var(--md-sys-color-on-primary-container);
    }

    .nav-title {
      font-family: var(--md-sys-typescale-body-large-font);
      font-weight: var(--md-sys-typescale-body-large-weight);
      font-size: var(--md-sys-typescale-body-large-size);
      line-height: var(--md-sys-typescale-body-large-line-height);

      margin-bottom: 8px;
      transition: all 0.3s ease;

      color: var(--md-sys-color-primary);
    }

    .nav-description {
      font-family: var(--md-sys-typescale-body-large-font);
      font-weight: var(--md-sys-typescale-body-large-weight);
      font-size: var(--md-sys-typescale-body-large-size);
      line-height: var(--md-sys-typescale-body-large-line-height);

    /* 回到顶部按钮 */

      bottom: 30px;
      right: 30px;
      width: 56px;
      height: 56px;

      justify-content: center;

      opacity: 0;
      transform: translateY(20px);
      transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      text-decoration: none;

    /* 扩散效果容器 */

      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;

      z-index: 9999;
      overflow: hidden;

      position: absolute;

      transform: scale(0);
      animation: ripple-animation 0.6s linear forwards;
      pointer-events: none;

    @keyframes ripple-animation {

        transform: scale(4);
        opacity: 0;

    /* 优化的上浮动画，带有弹性效果 */
    @keyframes fadeInUp {
      from {
        opacity: 0;
        transform: translateY(30px);
      }
      60% {
        opacity: 0.8;
        transform: translateY(-10px);
      }
      80% {
        opacity: 0.9;
        transform: translateY(5px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* 淡出下滑动画 */
    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }
      to {
        opacity: 1;
        transform: translateY(0);
      }

    /* 加载动画样式 */

      top: 0;
      left: 0;
      width: 100%;
      height: 100%;

      align-items: center;
      justify-content: center;
      z-index: 9999;
      transition: all 0.6s cubic-bezier(0.4, 0, 0.2, 1);

      }

        // 更新DOM元素
        document.getElementById('dailyQuoteAuthor').textContent = data.nick;
        document.getElementById('dailyQuoteContent').textContent = data.yiyan;

        console.error('获取每日一言失败:', error);

    // Mini恐龙游戏逻辑
    class DinoGame {
      constructor() {
        this.canvas = document.getElementById('dinoGameCanvas');
        this.ctx = this.canvas.getContext('2d');
        this.scoreElement = document.getElementById('dinoScore');
        
        // 游戏状态
        this.gameRunning = false;
        this.score = 0;
        this.speed = 3;
        
        // 恐龙属性
        this.dino = {
          x: this.canvas.width - 40,
          y: 70,
          width: 18,
          height: 24,
          jumping: false,
          jumpHeight: 0,
          jumpSpeed: 0,
          maxJumpHeight: 40,
          jumpVelocity: 8
        };
        
        // 障碍物数组
        this.obstacles = [];
        this.obstacleSpawnTimer = 0;
        this.obstacleSpawnInterval = 60;
        
        // 云数组
        this.clouds = [];
        this.cloudSpawnTimer = 0;
        this.cloudSpawnInterval = 120;
        
        // 按键状态
        this.keys = {};
        
        // 初始化
        this.init();
      }
      
      init() {
        // 绑定键盘事件
        document.addEventListener('keydown', (e) => {
          this.keys[e.code] = true;
          if (e.code === 'Space' && !this.gameRunning) {
            this.start();
          }
        });
        
        document.addEventListener('keyup', (e) => {
          this.keys[e.code] = false;
        });
        
        // 绑定点击事件
        this.canvas.addEventListener('click', () => {
          if (!this.gameRunning) {
            this.start();
          } else {
            this.jump();
          }
        });
        
        // 初始渲染
        this.render();
      }
      
      start() {
        this.gameRunning = true;
        this.score = 0;
        this.speed = 3;
        this.obstacles = [];
        this.obstacleSpawnTimer = 0;
        this.updateScore();
        this.gameLoop();
      }
      
      jump() {
        if (!this.dino.jumping) {
          this.dino.jumping = true;
          this.dino.jumpSpeed = -this.dino.jumpVelocity;
        }
      }
      
      update() {
        // 处理按键
        if (this.keys['Space']) {
          this.jump();
        }
        
        // 更新恐龙位置
        if (this.dino.jumping) {
          this.dino.y += this.dino.jumpSpeed;
          this.dino.jumpSpeed += 0.5; // 重力
          
          if (this.dino.y >= 70) {
            this.dino.y = 70;
            this.dino.jumping = false;
          }
        }
        
        // 生成障碍物
        this.obstacleSpawnTimer++;
        if (this.obstacleSpawnTimer >= this.obstacleSpawnInterval) {
          this.obstacles.push({
            x: -20,
            y: 70,
            width: 15,
            height: 20
          });
          this.obstacleSpawnTimer = 0;
          
          // 随机调整生成间隔
          this.obstacleSpawnInterval = Math.random() * 30 + 40;
        }
        
        // 更新障碍物位置
        for (let i = this.obstacles.length - 1; i >= 0; i--) {
          const obstacle = this.obstacles[i];
          obstacle.x += this.speed;
          
          // 移除超出画布的障碍物
          if (obstacle.x > this.canvas.width) {
            this.obstacles.splice(i, 1);
            this.score++;
            this.updateScore();
            
            // 随着分数增加，提高游戏速度,改了，是说怪怪的
            if (this.score % 10 === 0) {
              this.speed += 0;
            }
          }
          
          // 碰撞检测
          if (this.checkCollision(this.dino, obstacle)) {
            this.gameOver();
            return;
          }
        }
        
        // 生成云
        this.cloudSpawnTimer++;
        if (this.cloudSpawnTimer >= this.cloudSpawnInterval) {
          // 云速度：基础速度 - 游戏速度 * 系数，速度越高云越慢，符合透视原理
          const baseCloudSpeed = 2;
          const cloudSpeed = baseCloudSpeed - this.speed * 0.1;
          
          this.clouds.push({
            x: -30,
            y: Math.random() * 30 + 10,
            width: 30,
            height: 15,
            speed: Math.max(cloudSpeed, 0.3) // 确保云有最小速度
          });
          this.cloudSpawnTimer = 0;
          
          // 随机调整生成间隔
          this.cloudSpawnInterval = Math.random() * 60 + 120;
        }
        
        // 更新云位置
        for (let i = this.clouds.length - 1; i >= 0; i--) {
          const cloud = this.clouds[i];
          cloud.x += cloud.speed;
          
          // 移除超出画布的云
          if (cloud.x > this.canvas.width) {
            this.clouds.splice(i, 1);
          }
        }
      }
      
      checkCollision(rect1, rect2) {
        return rect1.x < rect2.x + rect2.width &&
               rect1.x + rect1.width > rect2.x &&
               rect1.y < rect2.y + rect2.height &&
               rect1.y + rect1.height > rect2.y;
      }
      
      render() {
        // 清空画布
        this.ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--md-sys-color-surface');
        this.ctx.fillRect(0, 0, this.canvas.width, this.canvas.height);
        
        // 绘制地面
        this.ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--md-sys-color-outline');
        this.ctx.fillRect(0, 90, this.canvas.width, 2);
        
        // 绘制云
        this.clouds.forEach(cloud => {
          this.ctx.font = '20px Arial';
          this.ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--md-sys-color-on-surface-variant');
          this.ctx.fillText('☁️', cloud.x, cloud.y + cloud.height);
        });
        
        // 绘制恐龙
        this.ctx.font = '20px Arial';
        this.ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--md-sys-color-on-surface');
        this.ctx.fillText('🦖', this.dino.x, this.dino.y + this.dino.height);
        
        // 绘制障碍物
        this.obstacles.forEach(obstacle => {
          this.ctx.font = '20px Arial';
          this.ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--md-sys-color-on-surface');
          this.ctx.fillText('🌵', obstacle.x, obstacle.y + obstacle.height);
        });
        
        // 游戏开始提示
        if (!this.gameRunning) {
          this.ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--md-sys-color-on-surface-variant');
          this.ctx.font = '16px Arial';
          this.ctx.textAlign = 'center';
          this.ctx.fillText('点击或按空格键开始', this.canvas.width / 2, this.canvas.height / 2);
          this.ctx.textAlign = 'left';
        }
      }
      
      gameLoop() {
        if (!this.gameRunning) return;
        
        this.update();
        this.render();
        requestAnimationFrame(() => this.gameLoop());
      }
      
      gameOver() {
        this.gameRunning = false;
        
        // 显示游戏结束
        this.ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--md-sys-color-on-surface-variant');
        this.ctx.font = '16px Arial';
        this.ctx.textAlign = 'center';
        this.ctx.fillText('游戏结束！按空格键重新开始', this.canvas.width / 2, this.canvas.height / 2 + 20);
        this.ctx.textAlign = 'left';
      }
      
      updateScore() {
        this.scoreElement.textContent = this.score;
      }
    }

      new DinoGame();
    });

      function closeCardDialog() {

    // 生成快速导航
    function renderQuickNav() {
      if (!quickNav) return; // 修复：检查元素是否存在
      
      quickNav.innerHTML = '<div class="quick-nav-grid"></div>';
      const grid = quickNav.querySelector('.quick-nav-grid');
      
      websiteData.forEach(category => {
        const item = document.createElement('a');
        item.href = `#${category.id}`;
        item.className = 'quick-nav-item';
        item.onclick = (e) => {
          e.preventDefault();
          scrollToSection(category.id);
          quickNav.style.display = 'none';
          document.body.classList.remove('searching');

        // 映射图标名称到Unicode字符

          'star': '⭐',
          'code': '💻',
          'palette': '🎨',
          'mail': '📧'
        };

        item.innerHTML = `
          <span class="quick-nav-icon" style="font-size: 20px;">${icon}</span>

        `;

    }

    // 搜索功能 - 实时搜索
    if (searchBar) {
      searchBar.addEventListener('focus', () => {
        document.body.classList.add('searching');
        // 移除快速导航，不再显示
      });
      
      searchBar.addEventListener('input', (e) => {
        const query = e.target.value.toLowerCase();
        
        if (query.length > 0) {
          if (searchType.value === 'site') {
            // 站内搜索
            // 过滤结果
            const filteredSites = allSites.filter(site => 
              site.title.toLowerCase().includes(query) || 
              site.description.toLowerCase().includes(query)
            );
            
            // 显示搜索结果
            renderSearchResults(filteredSites);
            
            // 动态定位搜索结果到搜索框下方
            const searchContainer = searchBar.closest('.search-container');
            if (searchContainer) {
              const rect = searchContainer.getBoundingClientRect();
              quickNav.style.left = `${rect.left}px`;
              quickNav.style.top = `${rect.bottom}px`;
              quickNav.style.width = `${rect.width}px`;
            }
            
            quickNav.style.display = 'block'; // 立即显示快速导航
          } else {
            // 站外搜索：不显示任何推荐
            quickNav.style.display = 'none';
          }
        } else {
          // 清空搜索时隐藏结果
          quickNav.style.display = 'none';
        }
      });
      
      // 添加回车搜索功能
      searchBar.addEventListener('keypress', (e) => {
        if (e.key === 'Enter') {
          const query = searchBar.value.trim();
          if (query.length > 0 && searchType.value !== 'site') {
            // 站外搜索：直接跳转到搜索引擎
            const searchEngineUrls = {
              'baidu': `https://www.baidu.com/s?wd=${encodeURIComponent(query)}`,
              'bing': `https://www.bing.com/search?q=${encodeURIComponent(query)}`,
              '360': `https://www.so.com/s?q=${encodeURIComponent(query)}`
            };
            window.open(searchEngineUrls[searchType.value], '_blank');
          }
        }
      });
    }
    
    // 点击外部区域隐藏快速导航
    document.addEventListener('click', (e) => {
      if (searchBar && quickNav && !searchBar.contains(e.target) && !quickNav.contains(e.target)) {
        quickNav.style.display = 'none';
        document.body.classList.remove('searching');
      }
    });

    function renderSearchResults(results) {
      if (!quickNav) return; // 修复：检查元素是否存在
      
      quickNav.innerHTML = '';
      
      if (results.length === 0) {
        const noResultItem = document.createElement('div');
        noResultItem.className = 'quick-nav-item';
        noResultItem.textContent = '未找到匹配的网站';
        quickNav.appendChild(noResultItem);
        return;
      }
      
      results.forEach(site => {
        const item = document.createElement('a');
        item.href = site.url;
        item.className = 'quick-nav-item';
        item.target = '_blank'; // 在新标签页打开链接
        item.onclick = (e) => {
          e.stopPropagation();
        };
        
        // 生成头像HTML，优先使用emoji，然后是avatar，最后是默认emoji
        let avatarHTML = '';
        
        if (site.emoji) {
          // 使用emoji
          avatarHTML = `<div class="nav-avatar" style="width: 40px; height: 40px; margin-bottom: 4px; border-radius: 50%; background-color: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container); display: flex; align-items: center; justify-content: center; font-size: 16px; border: 2px solid var(--md-sys-color-primary); padding: 4px;">${site.emoji}</div>`;
        } else if (site.avatar) {
          // 使用图片
          avatarHTML = `<img src="${site.avatar}" alt="${site.title}" class="nav-avatar" style="width: 40px; height: 40px; margin-bottom: 4px; border-radius: 50%; object-fit: contain; border: 2px solid var(--md-sys-color-primary); padding: 2px; background-color: var(--md-sys-color-surface);">`;
        } else {
          // 使用默认emoji
          avatarHTML = `<div class="nav-avatar" style="width: 40px; height: 40px; margin-bottom: 4px; border-radius: 50%; background-color: var(--md-sys-color-primary-container); color: var(--md-sys-color-on-primary-container); display: flex; align-items: center; justify-content: center; font-size: 16px; border: 2px solid var(--md-sys-color-primary); padding: 4px;">🌐</div>`;
        }
        
        item.innerHTML = `
          ${avatarHTML}
          <div>
            <div class="nav-title" style="font-size: 14px; margin-bottom: 2px;">${site.title}</div>
            <div class="nav-description" style="font-size: 12px;">${site.description}</div>
          </div>

        quickNav.appendChild(item);

    // 生成站外搜索建议
    function renderExternalSearchSuggestions(query, type) {
      if (!quickNav) return;
      
      quickNav.innerHTML = '';
      
      // 搜索引擎URL模板
      const searchEngineUrls = {
        'baidu': `https://www.baidu.com/s?wd=${encodeURIComponent(query)}`,
        'bing': `https://www.bing.com/search?q=${encodeURIComponent(query)}`,
        '360': `https://www.so.com/s?q=${encodeURIComponent(query)}`
      };
      
      // 搜索引擎名称
      const searchEngineNames = {
        'baidu': '百度',
        'bing': 'Bing',
        '360': '360搜索'
      };
      
      // 生成搜索建议
      const suggestions = [
        `在${searchEngineNames[type]}搜索 "${query}"`,
        `使用${searchEngineNames[type]}搜索相关内容`,
        `${searchEngineNames[type]}搜索结果: ${query}`
      ];
      
      // 创建搜索建议项
      suggestions.forEach((suggestion, index) => {
        const item = document.createElement('a');
        item.href = searchEngineUrls[type];
        item.className = 'quick-nav-item';
        item.target = '_blank';
        item.onclick = (e) => {
          e.stopPropagation();
        };
        
        // 搜索引擎图标
        const engineIcons = {
          'baidu': '🔍',
          'bing': '🌐',
          '360': '💡'
        };
        
        item.innerHTML = `
          <span style="font-size: 20px; margin-right: 8px;">${engineIcons[type] || '🔍'}</span>
          <span>${suggestion}</span>
        `;
        quickNav.appendChild(item);
      });
    }

    // 跳转到指定区域
    function scrollToSection(sectionId) {
      const section = document.getElementById(sectionId);
      if (section) {
        section.scrollIntoView({ behavior: 'smooth' });
      }
    }

    // 更新时间显示
    function updateTime() {
      const timeDisplay = document.getElementById('timeDisplay');
      if (!timeDisplay) return;
      
      const now = new Date();
      const hours = now.getHours().toString().padStart(2, '0');
      const minutes = now.getMinutes().toString().padStart(2, '0');
      const seconds = now.getSeconds().toString().padStart(2, '0');
      const year = now.getFullYear();
      const month = (now.getMonth() + 1).toString().padStart(2, '0');
      const day = now.getDate().toString().padStart(2, '0');
      const weekDays = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'];
      const weekDay = weekDays[now.getDay()];
      
      timeDisplay.innerHTML = `
        <div style="font-size: 36px; font-weight: bold;">${hours}:${minutes}:${seconds}</div>
        <div style="font-size: 16px; margin-top: 8px;">${year}-${month}-${day} ${weekDay}</div>
      `;
    }
    
    // 重写initSideNav函数，使其只显示分类导航并实现点击滚动功能
    function initSideNav() {
      const logoButton = document.getElementById('logoButton');
      const sideNavContainer = document.getElementById('sideNavContainer');
      const sideNavOverlay = document.getElementById('sideNavOverlay');
      const closeSideNav = document.getElementById('closeSideNav');
      const sideNavContent = document.getElementById('sideNavContent');
      
      if (!logoButton || !sideNavContainer || !sideNavOverlay || !closeSideNav || !sideNavContent) return;
      
      // 生成导航栏内容 - 只显示分类导航
      function renderSideNav() {
        sideNavContent.innerHTML = '';
        
        // 遍历所有网站分类
        websiteData.forEach(category => {
          // 映射图标名称到Unicode字符
          const iconMap = {
            'star': '⭐',
            'code': '💻',
            'palette': '🎨',
            'mail': '📧'
          };
          const icon = iconMap[category.icon] || '📋';
          
          // 创建分类导航项
          const categoryNavItem = document.createElement('button');
          categoryNavItem.style.cssText = `
            display: flex;
            align-items: center;
            width: 100%;
            padding: 16px 20px;
            margin-bottom: 8px;
            background-color: var(--md-sys-color-surface);
            color: var(--md-sys-color-on-surface);
            border: none;
            border-radius: var(--md-sys-shape-corner-medium);
            cursor: pointer;
            font-family: var(--md-sys-typescale-body-large-font);
            font-size: var(--md-sys-typescale-body-large-size);
            text-align: left;
            transition: all 0.2s ease;
          `;
          categoryNavItem.innerHTML = `<span style="margin-right: 12px; font-size: 20px;">${icon}</span>${category.category}`;
          
          // 悬停效果
          categoryNavItem.addEventListener('mouseenter', () => {
            categoryNavItem.style.backgroundColor = 'var(--md-sys-color-primary-container)';
            categoryNavItem.style.color = 'var(--md-sys-color-on-primary-container)';
          });
          
          categoryNavItem.addEventListener('mouseleave', () => {
            categoryNavItem.style.backgroundColor = 'var(--md-sys-color-surface)';
            categoryNavItem.style.color = 'var(--md-sys-color-on-surface)';
          });
          
          // 点击事件 - 滚动到对应分类位置
          categoryNavItem.addEventListener('click', () => {
            // 关闭导航栏
            closeSideNavMenu();
            
            // 滚动到对应分类
            const section = document.getElementById(category.id);
            if (section) {
              section.scrollIntoView({ behavior: 'smooth' });
            }
          });
          
          // 添加到导航内容中
          sideNavContent.appendChild(categoryNavItem);
        });
      }
      
      // 显示导航栏
      function showSideNavMenu() {
        sideNavContainer.style.left = '0';
        sideNavOverlay.style.display = 'block';
        document.body.style.overflow = 'hidden';
        
        // 延迟设置opacity，确保过渡效果可见
        setTimeout(() => {
          sideNavOverlay.style.opacity = '1';
        }, 10);
      }
      
      // 隐藏导航栏
      function closeSideNavMenu() {
        sideNavContainer.style.left = '-300px';
        sideNavOverlay.style.opacity = '0';
        
        // 等待动画结束后隐藏遮罩和恢复滚动
        setTimeout(() => {
          sideNavOverlay.style.display = 'none';
          document.body.style.overflow = 'auto';
        }, 300);
      }
      
      // 初始化导航栏内容
      renderSideNav();
      
      // 点击logo显示/隐藏导航栏
      logoButton.addEventListener('click', () => {
        if (sideNavContainer.style.left === '0px') {
          closeSideNavMenu();
        } else {
          showSideNavMenu();
        }
      });
      
      // 关闭导航栏事件
      closeSideNav.addEventListener('click', closeSideNavMenu);
      sideNavOverlay.addEventListener('click', closeSideNavMenu);
      
      // ESC键关闭导航栏
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && sideNavContainer.style.left === '0px') {
          closeSideNavMenu();
        }
      });
    }
    
    // 页面加载完成后生成内容
    document.addEventListener('DOMContentLoaded', () => {
      renderAllSections();
      
      // 加载每日一图
      loadDailyImage();
      
      // 初始化并更新时间显示
      updateTime();
      setInterval(updateTime, 1000);
      
      // 初始化左侧导航栏
      initSideNav();
      
      // 检查本地存储中的主题设置
      const savedTheme = localStorage.getItem('theme');
      if (savedTheme === 'light') {
        document.body.classList.add('light-theme');
      }
      
      // 检查本地存储中的主题色设置
      const savedThemeColor = localStorage.getItem('themeColor');
      if (savedThemeColor) {
        updateThemeColor(savedThemeColor);
        
        // 更新主题色选择器的选中状态
        const colorOptions = document.querySelectorAll('.color-option');
        colorOptions.forEach(option => {
          if (option.dataset.color === savedThemeColor) {
            option.style.borderColor = savedThemeColor;
          }
        });
      }
      
      // 检查本地存储中的搜索类型设置
      const savedSearchType = localStorage.getItem('searchType');
      if (savedSearchType) {
        searchType.value = savedSearchType;
      }
      
      // 保存搜索类型到本地存储
      searchType.addEventListener('change', () => {
        localStorage.setItem('searchType', searchType.value);
        // 清空搜索框并更新搜索结果
        searchBar.value = '';
        if (searchType.value === 'site') {
          renderQuickNav();
        } else {
          quickNav.innerHTML = '';
        }
      });
      
      // 添加加载动画
      setTimeout(() => {
        const sections = document.querySelectorAll('.section');
        sections.forEach((section, index) => {
          setTimeout(() => {
            section.classList.add('loaded');
          }, index * 200); // 每个section延迟200ms
        });
      }, 100); // 稍微延迟开始动画
    });
    
    // 左侧导航栏功能
    function initSideNav() {
      const logoButton = document.getElementById('logoButton');
      const sideNavContainer = document.getElementById('sideNavContainer');
      const sideNavOverlay = document.getElementById('sideNavOverlay');
      const closeSideNav = document.getElementById('closeSideNav');
      const sideNavContent = document.getElementById('sideNavContent');
      
      if (!logoButton || !sideNavContainer || !sideNavOverlay || !closeSideNav || !sideNavContent) return;
      
      // 生成导航栏内容
      function renderSideNav() {
        sideNavContent.innerHTML = '';
        
        websiteData.forEach(category => {
          const categoryItem = document.createElement('div');
          categoryItem.style.marginBottom = '20px';
          
          // 映射图标名称到Unicode字符
          const iconMap = {
            'star': '⭐',
            'code': '💻',
            'palette': '🎨',
            'mail': '📧'
          };
          const icon = iconMap[category.icon] || '📋';
          
          // 创建分类标题
          const categoryTitle = document.createElement('h3');
          categoryTitle.style.cssText = `
            font-family: var(--md-sys-typescale-title-large-font);
            font-size: var(--md-sys-typescale-title-large-size);
            color: var(--md-sys-color-on-surface);
            margin: 0 0 12px 0;
            display: flex;
            align-items: center;
          `;
          categoryTitle.innerHTML = `<span style="margin-right: 8px;">${icon}</span>${category.category}`;
          categoryItem.appendChild(categoryTitle);
          
          // 创建分类下的站点列表
          const sitesList = document.createElement('div');
          sitesList.style.display = 'flex';
          sitesList.style.flexDirection = 'column';
          sitesList.style.gap = '8px';
          
          category.sites.forEach(site => {
            const siteItem = document.createElement('a');
            siteItem.href = site.url;
            siteItem.target = '_blank';
            siteItem.style.cssText = `
              display: flex;
              align-items: center;
              padding: 12px 16px;
              background-color: var(--md-sys-color-surface);
              color: var(--md-sys-color-on-surface);
              text-decoration: none;
              border-radius: var(--md-sys-shape-corner-medium);
              transition: all 0.2s ease;
            `;
            
            // 站点图标
            let siteIcon = '🌐';
            if (site.emoji) {
              siteIcon = site.emoji;
            }
            
            siteItem.innerHTML = `
              <span style="margin-right: 12px; font-size: 20px;">${siteIcon}</span>
              <div>
                <div style="font-weight: 500;">${site.title}</div>
                <div style="font-size: 12px; color: var(--md-sys-color-on-surface-variant); margin-top: 2px;">${site.description}</div>
              </div>
            `;
            
            // 悬停效果
            siteItem.addEventListener('mouseenter', () => {
              siteItem.style.backgroundColor = 'var(--md-sys-color-primary-container)';
              siteItem.style.color = 'var(--md-sys-color-on-primary-container)';
            });
            
            siteItem.addEventListener('mouseleave', () => {
              siteItem.style.backgroundColor = 'var(--md-sys-color-surface)';
              siteItem.style.color = 'var(--md-sys-color-on-surface)';
            });
            
            // 点击关闭导航栏
            siteItem.addEventListener('click', () => {
              closeSideNavMenu();
            });
            
            sitesList.appendChild(siteItem);
          });
          
          categoryItem.appendChild(sitesList);
          sideNavContent.appendChild(categoryItem);
        });
      }
      
      // 显示导航栏
      function showSideNavMenu() {
        sideNavContainer.style.left = '0';
        sideNavOverlay.style.display = 'block';
        document.body.style.overflow = 'hidden';
        
        // 延迟设置opacity，确保过渡效果可见
        setTimeout(() => {
          sideNavOverlay.style.opacity = '1';
        }, 10);
      }
      
      // 隐藏导航栏
      function closeSideNavMenu() {
        sideNavContainer.style.left = '-300px';
        sideNavOverlay.style.opacity = '0';
        
        // 等待动画结束后隐藏遮罩和恢复滚动
        setTimeout(() => {
          sideNavOverlay.style.display = 'none';
          document.body.style.overflow = 'auto';
        }, 300);
      }
      
      // 初始化导航栏内容
      renderSideNav();
      
      // 点击logo显示/隐藏导航栏
      logoButton.addEventListener('click', () => {
        if (sideNavContainer.style.left === '0px') {
          closeSideNavMenu();
        } else {
          showSideNavMenu();
        }
      });
      
      // 关闭导航栏事件
      closeSideNav.addEventListener('click', closeSideNavMenu);
      sideNavOverlay.addEventListener('click', closeSideNavMenu);
      
      // ESC键关闭导航栏
      document.addEventListener('keydown', (e) => {
        if (e.key === 'Escape' && sideNavContainer.style.left === '0px') {
          closeSideNavMenu();
        }
      });
    }
    
    // 加载每日一图
    function loadDailyImage() {
      const dailyImageBg = document.getElementById('dailyImageBg');
      if (!dailyImageBg) return;
      
      // 获取当前选择的背景API和关键词
      const backgroundApi = localStorage.getItem('backgroundApi') || 'bing';
      const wpKeyword = localStorage.getItem('wpKeyword') || '';
      
      // 添加加载过渡效果
      dailyImageBg.style.opacity = '0';
      dailyImageBg.style.transition = 'opacity 1s ease-in-out';
      
      if (backgroundApi === 'bing') {
        // 使用必应每日壁纸API
        const apiUrl = 'https://uapis.cn/api/v1/image/bing-daily';
        
        // 设置背景图片
        dailyImageBg.style.backgroundImage = `url(${apiUrl})`;
        
        // 创建一个临时图片元素来监听加载状态
        const tempImg = new Image();
        tempImg.src = apiUrl;
        
        // 处理图片加载失败的情况
        tempImg.onerror = function() {
          // 加载失败时使用默认图片
          dailyImageBg.style.backgroundImage = `url(https://via.placeholder.com/1200x400/49454F/938F99?text=每日一图)`;
          // 触发淡入效果
          setTimeout(() => {
            dailyImageBg.style.opacity = '1';
          }, 50);
        };
        
        // 添加加载完成的过渡效果
        tempImg.onload = function() {
          // 触发重排
          void dailyImageBg.offsetWidth;
          
          // 淡入效果
          dailyImageBg.style.opacity = '1';
        };
      } else if (backgroundApi === 'wp') {
        // 使用壁纸API
        let apiUrl = 'https://wp.upx8.com/api.php';
        if (wpKeyword) {
          apiUrl += `?content=${encodeURIComponent(wpKeyword)}`;
        }
        
        // 直接使用API URL作为图片URL
        const imgUrl = apiUrl;
        
        // 设置背景图片
        dailyImageBg.style.backgroundImage = `url(${imgUrl})`;
        
        // 创建临时图片元素来监听加载状态
        const tempImg = new Image();
        tempImg.src = imgUrl;
        
        // 处理图片加载失败的情况
        tempImg.onerror = function() {
          // 加载失败时使用默认图片
          dailyImageBg.style.backgroundImage = `url(https://via.placeholder.com/1200x400/49454F/938F99?text=每日一图)`;
          // 触发淡入效果
          setTimeout(() => {
            dailyImageBg.style.opacity = '1';
          }, 50);
        };
        
        // 添加加载完成的过渡效果
        tempImg.onload = function() {
          // 触发重排
          void dailyImageBg.offsetWidth;
          
          // 淡入效果
          dailyImageBg.style.opacity = '1';
        };
      }
    }

    // 回到顶部功能
    if (backToTopButton) {
      backToTopButton.addEventListener('click', () => {
        window.scrollTo({
          top: 0,
          behavior: 'smooth'
        });
      });
    }

    // 监听滚动事件 - 只处理回到顶部按钮显示
    window.addEventListener('scroll', () => {
      const scrollTop = window.pageYOffset || document.documentElement.scrollTop;
      
      // 控制回到顶部按钮的显示/隐藏
      if (scrollTop > 300) {
        backToTopButton.classList.add('visible');
      } else {
        backToTopButton.classList.remove('visible');
      }
    });

    // 主题设置功能
    if (themeToggle) {
      const colorPaletteContainer = document.getElementById('colorPaletteContainer');
      const closePalette = document.getElementById('closePalette');
      
      // 打开调色盘窗口
      themeToggle.addEventListener('click', () => {
        colorPaletteContainer.style.display = 'flex';
      });
      
      // 关闭调色盘窗口（带动画）
      function closePaletteWindow() {
        const palette = colorPaletteContainer.querySelector('.color-palette');
        palette.style.animation = 'fadeOutDown 0.3s ease-out forwards';
        
        // 等待动画结束后隐藏容器
        setTimeout(() => {
          colorPaletteContainer.style.display = 'none';
          // 重置动画，以便下次打开时重新播放
          palette.style.animation = 'fadeInUp 0.3s ease-out';
        }, 300);
      }
      
      closePalette.addEventListener('click', closePaletteWindow);
      
      // 点击调色盘外部关闭窗口
      colorPaletteContainer.addEventListener('click', (e) => {
        if (e.target === colorPaletteContainer) {
          closePaletteWindow();
        }
      });
      
      // 主题色选择功能
      const colorOptions = document.querySelectorAll('.color-option');
      colorOptions.forEach(option => {
        option.addEventListener('click', () => {
          const color = option.dataset.color;
          updateThemeColor(color);
          
          // 更新选中状态
          colorOptions.forEach(opt => opt.style.borderColor = 'transparent');
          option.style.borderColor = color;
          
          // 保存主题色设置
          localStorage.setItem('themeColor', color);
        });
      });
      
      // 主题模式选择功能
      const modeOptions = document.querySelectorAll('.mode-option');
      modeOptions.forEach(option => {
        option.addEventListener('click', () => {
          const mode = option.dataset.mode;
          
          // 更新选中状态
          modeOptions.forEach(opt => {
            opt.style.backgroundColor = 'var(--md-sys-color-surface-variant)';
            opt.style.color = 'var(--md-sys-color-on-surface-variant)';
            opt.style.borderColor = 'var(--md-sys-color-outline)';
          });
          option.style.backgroundColor = 'var(--md-sys-color-primary)';
          option.style.color = 'var(--md-sys-color-on-primary)';
          option.style.borderColor = 'var(--md-sys-color-primary)';
          
          // 切换主题模式
          if (mode === 'dark') {
            document.body.classList.remove('light-theme');
          } else {
            document.body.classList.add('light-theme');
          }
          
          // 保存主题模式设置
          localStorage.setItem('theme', mode);
        });
      });
      
      // 背景API选择功能
      const backgroundApiOptions = document.querySelectorAll('.background-api-option');
      const wpKeywordContainer = document.getElementById('wpKeywordContainer');
      const wpKeyword = document.getElementById('wpKeyword');
      const applyBackgroundButton = document.getElementById('applyBackground');
      
      // 初始化背景API选择状态
      const savedBackgroundApi = localStorage.getItem('backgroundApi') || 'bing';
      backgroundApiOptions.forEach(option => {
        if (option.dataset.api === savedBackgroundApi) {
          option.style.backgroundColor = 'var(--md-sys-color-primary)';
          option.style.color = 'var(--md-sys-color-on-primary)';
          option.style.borderColor = 'var(--md-sys-color-primary)';
        }
      });
      
      // 初始化关键词输入框
      const savedWpKeyword = localStorage.getItem('wpKeyword') || '';
      if (wpKeyword) {
        wpKeyword.value = savedWpKeyword;
      }
      
      // 显示或隐藏关键词输入框
      if (savedBackgroundApi === 'wp') {
        if (wpKeywordContainer) {
          wpKeywordContainer.style.display = 'block';
        }
      }
      
      // 背景API选择事件监听器
      backgroundApiOptions.forEach(option => {
        option.addEventListener('click', () => {
          const api = option.dataset.api;
          
          // 更新选中状态
          backgroundApiOptions.forEach(opt => {
            opt.style.backgroundColor = 'var(--md-sys-color-surface-variant)';
            opt.style.color = 'var(--md-sys-color-on-surface-variant)';
            opt.style.borderColor = 'var(--md-sys-color-outline)';
          });
          option.style.backgroundColor = 'var(--md-sys-color-primary)';
          option.style.color = 'var(--md-sys-color-on-primary)';
          option.style.borderColor = 'var(--md-sys-color-primary)';
          
          // 显示或隐藏关键词输入框
          if (wpKeywordContainer) {
            if (api === 'wp') {
              wpKeywordContainer.style.display = 'block';
            } else {
              wpKeywordContainer.style.display = 'none';
            }
          }
          
          // 保存背景API设置
          localStorage.setItem('backgroundApi', api);
        });
      });
      
      // 关键词输入事件监听器
      if (wpKeyword) {
        wpKeyword.addEventListener('input', () => {
          localStorage.setItem('wpKeyword', wpKeyword.value);
        });
      }
      
      // 应用背景按钮事件监听器
      if (applyBackgroundButton) {
        applyBackgroundButton.addEventListener('click', () => {
          loadDailyImage();
        });
      }
    }
    
    // 更新主题色
    function updateThemeColor(color) {
      const root = document.documentElement;
      
      // 根据主色调生成其他相关颜色（简化版）
      const colorObj = hexToRgb(color);
      if (!colorObj) return;
      
      // 生成深色版本（primary-container）
      const primaryContainer = adjustBrightness(color, -30);
      // 生成浅色版本（on-primary）
      const onPrimary = '#FFFFFF';
      // 生成on-primary-container颜色
      const onPrimaryContainer = adjustBrightness(color, 80);
      
      // 更新CSS变量
      root.style.setProperty('--md-sys-color-primary', color);
      root.style.setProperty('--md-sys-color-on-primary', onPrimary);
      root.style.setProperty('--md-sys-color-primary-container', primaryContainer);
      root.style.setProperty('--md-sys-color-on-primary-container', onPrimaryContainer);
      root.style.setProperty('--md-sys-color-surface-tint', color);
      root.style.setProperty('--md-sys-color-inverse-primary', color);
      
      // 更新浅色主题下的颜色
      root.style.setProperty('--md-sys-color-primary-light', color);
      root.style.setProperty('--md-sys-color-on-primary-light', onPrimary);
      root.style.setProperty('--md-sys-color-primary-container-light', adjustBrightness(color, 60));
      root.style.setProperty('--md-sys-color-on-primary-container-light', '#21005D');
      root.style.setProperty('--md-sys-color-surface-tint-light', color);
      root.style.setProperty('--md-sys-color-inverse-primary-light', color);
    }
    
    // 将十六进制颜色转换为RGB对象
    function hexToRgb(hex) {
      const result = /^#?([a-f\d]{2})([a-f\d]{2})([a-f\d]{2})$/i.exec(hex);
      return result ? {
        r: parseInt(result[1], 16),
        g: parseInt(result[2], 16),
        b: parseInt(result[3], 16)
      } : null;
    }
    
    // 调整颜色亮度
    function adjustBrightness(hex, percent) {
      const colorObj = hexToRgb(hex);
      if (!colorObj) return hex;
      
      const r = Math.max(0, Math.min(255, colorObj.r + (colorObj.r * percent / 100)));
      const g = Math.max(0, Math.min(255, colorObj.g + (colorObj.g * percent / 100)));
      const b = Math.max(0, Math.min(255, colorObj.b + (colorObj.b * percent / 100)));
      
      return `#${Math.round(r).toString(16).padStart(2, '0')}${Math.round(g).toString(16).padStart(2, '0')}${Math.round(b).toString(16).padStart(2, '0')}`;
    }

    // 创建扩散效果
    function createRippleEffect(x, y) {
      if (!rippleContainer) return;
      
      // 创建扩散元素
      const ripple = document.createElement('div');
      ripple.className = 'ripple';
      
      // 设置扩散元素的位置
      ripple.style.left = `${x}px`;
      ripple.style.top = `${y}px`;
      
      // 计算最大扩散半径（从中心到最远角落的距离）
      const maxRadius = Math.sqrt(
        Math.max(x, window.innerWidth - x) ** 2 + 
        Math.max(y, window.innerHeight - y) ** 2
      );
      
      // 设置扩散元素的初始大小
      const initialSize = Math.max(48, 48); // 使用按钮的最小尺寸
      ripple.style.width = `${initialSize}px`;
      ripple.style.height = `${initialSize}px`;
      
      // 设置扩散元素的最大尺寸
      ripple.style.setProperty('--max-radius', `${maxRadius}px`);
      
      // 添加到容器
      rippleContainer.appendChild(ripple);
      
      // 动画结束后移除元素
      ripple.addEventListener('animationend', () => {
        ripple.remove();
      });
    }
  </script>
